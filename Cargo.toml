[package]
name = "wtop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An htop-style system monitor for Windows terminals"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
sysinfo = "0.38.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Services", "Win32_System_Threading"] }
