[package]
name = "wtop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An htop-style system monitor for Windows terminals"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
sysinfo = "0.38.0"
windows = { version = "0.62.2", features = ["Win32_System_ProcessStatus"] }
